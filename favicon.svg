<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="天雨流芳之印">
  <!-- 白文印：墨地为阳，米白为字，金线收边 -->
  <rect x="3" y="3" width="94" height="94" rx="10" fill="#1f2933"/>
  <rect x="3" y="3" width="94" height="94" rx="10" fill="none" stroke="#b8935a" stroke-width="2.5" opacity="0.9"/>
  <rect x="9" y="9" width="82" height="82" rx="6" fill="none" stroke="#f2f5f4" stroke-width="1" opacity="0.4"/>
  <g fill="#f2f5f4" font-family="'Noto Serif SC','STSong','SimSun',serif" font-weight="700" font-size="33" text-anchor="middle" dominant-baseline="central">
    <text x="68" y="31">天</text>
    <text x="68" y="71">雨</text>
    <text x="32" y="31">流</text>
    <text x="32" y="71">芳</text>
  </g>
</svg>